<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FNAF Signal Lost</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body style="overflow: hidden;">
    <div class="menu_game" id="menu_game">
    <div class="menu__title">
        <span>Five Nights at Freddy's</span>
        <h1>SIGNAL LOST</h1>
    </div>
    <div class="menu__buttons">
        <button id="playBtn" data-i18n="menu.title_gamestart">Start Game</button>
        <button id="settingsBtn" data-i18n="menu.title_settings">Settings</button>
        <button id="CreditsBtn" data-i18n="menu.title_credits">Credits</button>
        <button id="exitBtn" data-i18n="menu.exit">Exit</button>
    </div>
</div>

    <!-- SECTION SETTINGS -->
    <div id="settings" class="settings" style="display:none;">
    <h1 data-i18n="settings.title"></h1>

    <div>
        <label data-i18n="settings.languageLabel"></label>
        <button id="lang-en-btn">English</button>
        <button id="lang-es-btn">Español</button>
    </div>

    <!-- 🎵 Sonido -->
    <div class="setting-group">
        <h3>Sound Settings</h3>

        <!-- Ambience -->
        <div class="sound-option">
            <label for="ambience-volume">Ambience Volume</label>
            <input type="range" id="ambience-volume" min="0.1" max="1" step="0.1" value="1">
        </div>

        <!-- SFX -->
        <div class="sound-option">
            <label for="sfx-volume">SFX Volume</label>
            <input type="range" id="sfx-volume" min="0.1" max="1" step="0.1" value="1">
        </div>
    </div>


    <button id="back-menu-btn" data-i18n="settings.back"></button>
</div>

    <!-- SECTION CREDITS -->
     <div class="credits" id="credits" style="display:none;">
    <h1 data-i18n="credits.title"></h1>

    <div class="section-content">
        <!-- Equipo / Autor -->
        <section class="credits-section">
            <h2 data-i18n="credits.team"></h2>
            <ul>
                <li><strong data-i18n="credits.developer"></strong>Agustín Lezcano - Bytech Technology</li>
                <li><strong data-i18n="credits.artist"></strong>Agustín Lezcano - Bytech Technology</li>
                <li><strong data-i18n="credits.music"></strong>Agustín Lezcano - Bytech Technology</li>
            </ul>
        </section>

        <!-- Recursos externos -->
        <section class="credits-section">
            <h2 data-i18n="credits.resources"></h2>
            <ul>
                <li><strong data-i18n="credits.libs"></strong>Electron, Howler.js</li>
            </ul>
        </section>

        <!-- Agradecimientos -->
        <section class="credits-section thanks">
            <h2 data-i18n="credits.thanks"></h2>
            <p data-i18n="credits.thanksText"></p>
        </section>

        <!-- Información opcional -->
        <section class="credits-section">
            <h2 data-i18n="credits.info"></h2>
            <ul>
                <li><strong data-i18n="credits.version"></strong>1.0</li>
                <li><strong data-i18n="credits.year"></strong>2025</li>
                <li>
                    <span data-i18n="credits.github"></span>
                    <a href="https://github.com/Bytech-Technology" data-i18n="credits.githubName"></a>
                </li>
            </ul>
        </section>
    </div>

    <button id="closeCredits" data-i18n="credits.back">volver</button>
</div>
    
    <!-- WARNING SCREEN -->
    <div class="warning_screen" id="warning_screen" style="display: none;">
    <div class="warning_card">
        <img src="icons/warning.svg" alt="warning icon">
        <p data-i18n="warning.headphones"></p>
    </div>
    <div class="warning_card">
        <img src="icons/headphone.svg" alt="headphone icon">
        <p data-i18n="warning.intenseExperience"></p>
    </div>
</div>

    <!-- OFICE SCREEN -->
    <div id="ofice" class="ofice" style="display: none;">
    <div id="hud" class="content-hud">

      <rect x="5" y="5" width="473.724" height="240" rx="45" stroke="white" stroke-width="10" />

    <img id="battery-off" src="icons/batery_off.svg" style="display:none;">

  </div>
</div>
